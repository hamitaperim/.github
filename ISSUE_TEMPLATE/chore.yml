name: Chore
description: Maintain tooling, dependencies or operations
type: Chore
labels: [needs-triage]
body:
  - type: textarea
    id: problem
    attributes:
      label: Maintenance need
      description: Describe the current issue and operational impact.
    validations:
      required: true
  - type: textarea
    id: scope
    attributes:
      label: Proposed change and affected areas
      description: List the smallest change, callers and configuration affected.
    validations:
      required: true
  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance and validation
      description: Define the checks, preserved behavior and rollback or data-preservation steps where relevant.
    validations:
      required: true
  - type: textarea
    id: dependencies
    attributes:
      label: Dependencies and references
      description: Link the parent epic, related work and source evidence.
    validations:
      required: false
