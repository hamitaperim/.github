name: Bug report
description: Something on the site or the MCP server behaves wrong
labels: ["type:bug", "needs-triage"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for the report. Please say exactly what you did and what you saw.

        Found a security problem? Use the repository's Security tab to report it privately.
  - type: textarea
    id: what-happened
    attributes:
      label: What happened
      description: What you did, what you expected, and what you got instead.
      placeholder: |
        1. Opened ...
        2. Clicked or typed ...
        3. Expected ..., got ... instead
    validations:
      required: true
  - type: input
    id: url
    attributes:
      label: Page or tool
      description: The URL, or the MCP tool name.
      placeholder: https://hamitaperim.com/?view=week
    validations:
      required: true
  - type: dropdown
    id: device
    attributes:
      label: Device
      options:
        - Phone
        - Tablet
        - Desktop
        - Agent (MCP)
  - type: textarea
    id: extra
    attributes:
      label: Screenshots or logs
