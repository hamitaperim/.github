name: Bug report
description: Report behavior that fails its expected contract
type: Bug
labels: [needs-triage]
body:
  - type: textarea
    id: problem
    attributes:
      label: Actual and expected behavior
      description: Describe the difference and who is affected.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: Include the smallest reproduction and whether it is consistent.
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: Page or tool, browser/client version, device and approximate Israel-time occurrence.
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Screenshots or logs
      description: Remove secrets and personal data. Report security vulnerabilities through the security policy.
    validations:
      required: false
  - type: textarea
    id: acceptance
    attributes:
      label: Fix acceptance criteria
      description: State the corrected behavior and related behavior to preserve.
    validations:
      required: true
