name: Feature request
description: Propose a capability or improvement
type: Feature
labels: [needs-triage]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem and target user
      description: Who needs this and what do they do today?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed behavior
      description: Describe the smallest complete user or system flow.
    validations:
      required: true
  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance criteria
      description: List observable outcomes, including errors and empty states.
    validations:
      required: true
  - type: textarea
    id: constraints
    attributes:
      label: Constraints and dependencies
      description: Link the parent epic and prerequisites. Include Hebrew RTL, mobile and accessibility where relevant.
    validations:
      required: false
  - type: textarea
    id: references
    attributes:
      label: References
      description: Links, examples or mockups. Exclude private information in public issues.
    validations:
      required: false
